[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipelinerl"
version = "0.1.0"
description = "A scalable asynchronous reinforcement learning implementation with in-flight weight updates."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "ServiceNow" },
]
dependencies = [
    "aiohttp>=3.11.0",
    "accelerate==1.13.0",
    "deepspeed==0.18.8",
    "datasets>=3.6.0,<4.0.0",
    "dill>=0.3.8,<0.4",
    "numpy>=1.26.0",
    "packaging>=24.0",
    "Pillow>=10.4.0",
    "psutil>=5.9.0",
    "pydantic>=2.11.0",
    "requests>=2.32.0",
    "ring-flash-attn==0.1.6",
    "math-verify[antlr4_9_3]==0.7.0",
    "orjson==3.10.16",
    "redis==5.2.1",
    "transformers==5.3.0",
    "wandb>=0.19.0",
    "hydra-core>=1.3.2",
    "vllm==0.17.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipelinerl*"]

[tool.uv]
# `flash-attn` is built manually into the repo-local `prl` environment.
# Keep `uv run` from auto-locking or syncing over that hand-managed install.
managed = false
